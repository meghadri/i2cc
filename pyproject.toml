[project]
name = "i2cc"
version = "0.1.0"
description = "I2C Commander"
readme = "README.md"
authors = [
    { name = "Dmitri Priimak", email = "priimak@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "usb-monitor",
    "i2cdriver==1.0.6",
    "pyside6==6.11.1",
    "pytide6 @ git+https://github.com/priimak/PyTide6.git@v0.22.2",
    "sprats @ git+https://github.com/priimak/sprats.git@v0.8.0",
    "i2c-api @ git+https://github.com/priimak/i2c_api.git@v0.15.3",
    "rgscore @ git+https://github.com/priimak/rgscore.git@v0.13.0",
    "i2capi_i2cdriver @ git+https://github.com/priimak/i2capi_i2cdriver.git@v0.7.2",
    "requests>=2.34.2",
]

[project.scripts]
i2cc = "i2cc.main:main"

[build-system]
requires = ["setuptools", "wheel", "setuptools-git-versioning"]
build-backend = "setuptools.build_meta"

[tool.setuptools-git-versioning]
enabled = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "F", # Pyflakes
    "E", # pycodestyle
    "W", # pycodestyle
    "B", # flake8-bugbear
    "I", # isort
]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]

